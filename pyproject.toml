[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-engine"
version = "1.1.1"
description = "ML-first vector computation and retrieval engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Neel Panchal" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26.4,<2.0",
]

[project.optional-dependencies]
faiss = [
  "faiss-cpu>=1.7.4; platform_system != 'Darwin' or platform_machine != 'arm64'",
]
ml = [
  "scikit-learn>=1.4,<1.7",
]
dev = [
  "pytest>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/neelpanchal11/Vector-Engine"
Repository = "https://github.com/neelpanchal11/Vector-Engine"
Issues = "https://github.com/neelpanchal11/Vector-Engine/issues"
Documentation = "https://github.com/neelpanchal11/Vector-Engine/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_engine*"]
